<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VESC Terminal - Fixed BLE</title>

<style>
body {
    background:#1e1e1e;
    font-family:Courier New;
    margin:0;
    padding:20px;
    color:#0f0;
}

#terminal {
    background:#000;
    color:#0f0;
    height:650px;
    overflow-y:scroll;
    padding:12px;
    border:1px solid #333;
    white-space:pre-wrap;
}

.input-line {
    margin-top:10px;
    display:flex;
    gap:10px;
}

#input {
    flex:1;
    background:#111;
    color:#0f0;
    border:1px solid #444;
    padding:10px;
}

button {
    background:#222;
    color:#0f0;
    border:1px solid #0f0;
    padding:10px 20px;
    cursor:pointer;
}

.hex {
    color:#888;
    font-size:12px;
}
</style>
</head>

<body>

<button id="connectBtn">Connect to VESC</button>
<span id="status">Disconnected</span>

<div id="terminal">VESC BLE terminal ready...\n</div>

<div class="input-line">
    <input
        type="text"
        id="input"
        placeholder="Type command"
        autocomplete="off"
    >

    <button id="sendBtn">Send</button>
</div>

<script>

let writeChar = null;
let rxBuffer = [];

const SERVICE_UUID =
    '6e400001-b5a3-f393-e0a9-e50e24dcca9e';

const RX_UUID =
    '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

const TX_UUID =
    '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

const terminal =
    document.getElementById('terminal');

const input =
    document.getElementById('input');

const statusEl =
    document.getElementById('status');

function log(text, cls='') {

    const div =
        document.createElement('div');

    div.textContent = text;

    if (cls) {
        div.className = cls;
    }

    terminal.appendChild(div);

    terminal.scrollTop =
        terminal.scrollHeight;
}

function logHex(data, prefix='') {

    const hex =
        Array.from(data)
            .map(b =>
                b.toString(16)
                 .padStart(2,'0')
            )
            .join(' ');

    log(prefix + ' ' + hex, 'hex');
}

function crc16(buffer) {

    let crc = 0x0000;

    for (let i = 0; i < buffer.length; i++) {

        crc ^= (buffer[i] << 8);

        for (let j = 0; j < 8; j++) {

            if (crc & 0x8000) {
                crc = (crc << 1) ^ 0x1021;
            }
            else {
                crc <<= 1;
            }
        }
    }

    return crc & 0xFFFF;
}

function buildPacket(text) {

    const encoder =
        new TextEncoder();

    const textBytes =
        encoder.encode(text);

    // COMM_TERMINAL_CMD
    const payload =
        new Uint8Array([
            0x14,
            ...textBytes
        ]);

    const len = payload.length;

    const packet =
        new Uint8Array(len + 5);

    packet[0] = 0x02;
    packet[1] = len;

    packet.set(payload, 2);

    const crc =
        crc16(payload);

    packet[len + 2] =
        (crc >> 8) & 0xFF;

    packet[len + 3] =
        crc & 0xFF;

    packet[len + 4] = 0x03;

    return packet;
}

async function connect() {

    try {

        log('Requesting VESC...');

        const device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        services: [SERVICE_UUID]
                    }
                ]

            });

        device.addEventListener(
            'gattserverdisconnected',
            () => {

                log('Disconnected');

                statusEl.textContent =
                    'Disconnected';
            }
        );

        const server =
            await device.gatt.connect();

        log('Connected to GATT');

        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );

        writeChar =
            await service.getCharacteristic(
                RX_UUID
            );

        const notifyChar =
            await service.getCharacteristic(
                TX_UUID
            );

        await notifyChar.startNotifications();

        notifyChar.addEventListener(
            'characteristicvaluechanged',
            handleNotification
        );

        statusEl.textContent =
            'Connected';

        log('VESC connected');

    }
    catch (err) {

        log(
            'CONNECT ERROR: ' +
            err.message
        );
    }
}

function handleNotification(event) {

    const chunk =
        new Uint8Array(
            event.target.value.buffer
        );

    logHex(chunk, 'RECV');

    for (let b of chunk) {
        rxBuffer.push(b);
    }

    parsePackets();
}

function parsePackets() {

    while (true) {

        // need minimum packet size
        if (rxBuffer.length < 5) {
            return;
        }

        // sync to packet start
        while (
            rxBuffer.length > 0 &&
            rxBuffer[0] !== 0x02
        ) {
            rxBuffer.shift();
        }

        if (rxBuffer.length < 5) {
            return;
        }

        const len =
            rxBuffer[1];

        const totalLen =
            len + 5;

        // wait for full packet
        if (
            rxBuffer.length <
            totalLen
        ) {
            return;
        }

        const packet =
            rxBuffer.slice(
                0,
                totalLen
            );

        rxBuffer =
            rxBuffer.slice(
                totalLen
            );

        // verify packet end
        if (
            packet[totalLen - 1]
            !== 0x03
        ) {

            log(
                'Bad packet end'
            );

            continue;
        }

        const payload =
            packet.slice(
                2,
                2 + len
            );

        if (
            payload.length < 1
        ) {
            continue;
        }

        const cmd =
            payload[0];

        const data =
            payload.slice(1);

        log(
            'CMD 0x' +
            cmd.toString(16)
        );

        logHex(
            data,
            'DATA'
        );

        try {

            const decoder =
                new TextDecoder();

            const txt =
                decoder.decode(
                    new Uint8Array(data)
                );

            if (
                txt.trim().length > 0
            ) {

                log(
                    'TXT: ' +
                    txt.trim()
                );
            }

        }
        catch (e) {

            log(
                'Decode error'
            );
        }
    }
}


async function send() {

    if (!writeChar) {

        log('Not connected');
        return;
    }

    const cmd =
        input.value.trim();

    if (!cmd) {
        return;
    }

    const packet =
        buildPacket(cmd);

    logHex(packet, 'SEND');

    try {

        // BLE chunking
        for (
            let i = 0;
            i < packet.length;
            i += 20
        ) {

            const chunk =
                packet.slice(
                    i,
                    i + 20
                );

            await writeChar
                .writeValueWithoutResponse(
                    chunk
                );

            await new Promise(
                r => setTimeout(r, 10)
            );
        }

        log('> ' + cmd);

    }
    catch (err) {

        log(
            'SEND ERROR: ' +
            err.message
        );
    }

    input.value = '';
}

window.addEventListener(
    'DOMContentLoaded',
    () => {

        document
            .getElementById('connectBtn')
            .onclick = connect;

        document
            .getElementById('sendBtn')
            .onclick = send;

        input.addEventListener(
            'keypress',
            e => {

                if (e.key === 'Enter') {
                    send();
                }
            }
        );
    }
);

</script>

</body>
</html>
